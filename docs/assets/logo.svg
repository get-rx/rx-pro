<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#grad)"/>

  <!-- T-Rex body -->
  <ellipse cx="100" cy="120" rx="50" ry="40" fill="white"/>

  <!-- Head -->
  <ellipse cx="100" cy="70" rx="35" ry="30" fill="white"/>

  <!-- Eyes -->
  <circle cx="85" cy="65" r="8" fill="#0F172A"/>
  <circle cx="115" cy="65" r="8" fill="#0F172A"/>
  <circle cx="87" cy="63" r="3" fill="white"/>
  <circle cx="117" cy="63" r="3" fill="white"/>

  <!-- Mouth -->
  <path d="M 75 85 Q 100 95 125 85" stroke="#0F172A" stroke-width="3" fill="none"/>

  <!-- Teeth -->
  <path d="M 82 85 L 85 92 L 88 85" fill="#0F172A"/>
  <path d="M 97 87 L 100 94 L 103 87" fill="#0F172A"/>
  <path d="M 112 85 L 115 92 L 118 85" fill="#0F172A"/>

  <!-- Arms -->
  <ellipse cx="55" cy="110" rx="12" ry="8" fill="white" transform="rotate(-30 55 110)"/>
  <ellipse cx="145" cy="110" rx="12" ry="8" fill="white" transform="rotate(30 145 110)"/>

  <!-- Legs -->
  <ellipse cx="75" cy="155" rx="15" ry="12" fill="white"/>
  <ellipse cx="125" cy="155" rx="15" ry="12" fill="white"/>

  <!-- Tail -->
  <path d="M 150 120 Q 170 115 180 130 Q 175 140 160 135" fill="white"/>

  <!-- Spikes on back -->
  <path d="M 80 45 L 85 30 L 90 45" fill="white"/>
  <path d="M 95 42 L 100 25 L 105 42" fill="white"/>
  <path d="M 110 45 L 115 30 L 120 45" fill="white"/>
</svg>
