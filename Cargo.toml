[workspace]
resolver = "2"
members = ["rx-cli", "rx-core", "rx-plugin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["T-Rex Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/stherrien/t-rex"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"

# Glob patterns
glob = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }

# Async utilities
futures = "0.3"

# Dependency resolution
pubgrub = "0.2"

# Parallelism
rayon = "1.10"

# Compression
flate2 = "1.0"
zstd = "0.13"
zip = "2.2"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Collections
indexmap = { version = "2.7", features = ["serde"] }
smallvec = "1.13"

# Regex
regex = "1.11"

# Directory walking
walkdir = "2.5"

# Tar archives
tar = "0.4"

# Base64 encoding
base64 = "0.22"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# MD5 hashing
md5 = "0.7"

# Home directory
dirs = "6.0"

# Wasm plugins
extism = "1.7"

# Testing
proptest = "1.5"
tempfile = "3.15"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
rx-core = { path = "rx-core" }
rx-plugin = { path = "rx-plugin" }

[profile.release]
lto = true
codegen-units = 1
strip = true
