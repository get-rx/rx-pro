name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../rx-${{ matrix.target }}.tar.gz rx
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../rx-${{ matrix.target }}.zip rx.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx-${{ matrix.target }}
          path: rx-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create/Update Release
    needs: [build, build-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ -f CHANGELOG.md ]; then
            # Extract the section for this version from CHANGELOG.md
            # Looks for ## [version] or ## version and extracts until next ## or EOF
            NOTES=$(awk "/^## \\[?${VERSION}\\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
            if [ -n "$NOTES" ]; then
              echo "Found changelog for v$VERSION"
              # Use delimiter for multiline output
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              echo "$NOTES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "No changelog section found for v$VERSION"
              echo "notes=" >> $GITHUB_OUTPUT
            fi
          else
            echo "No CHANGELOG.md found"
            echo "notes=" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Release
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="${{ steps.changelog.outputs.notes }}"
          PRERELEASE="${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}"

          # Check if release exists
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null; then
            echo "Release exists, uploading assets..."
            # Upload all artifacts to the existing release
            find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" \) | while read -r file; do
              echo "Uploading: $file"
              gh release upload "$TAG" "$file" --clobber
            done
            # Update release notes if provided
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --notes "$NOTES"
            fi
            # Mark as not draft if it was a draft
            gh release edit "$TAG" --draft=false
          else
            echo "Creating new release..."
            NOTES_ARG=""
            if [ -n "$NOTES" ]; then
              NOTES_ARG="--notes \"$NOTES\""
            else
              NOTES_ARG="--generate-notes"
            fi
            PRERELEASE_ARG=""
            if [ "$PRERELEASE" = "true" ]; then
              PRERELEASE_ARG="--prerelease"
            fi
            # Create release with assets
            find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" \) -exec gh release create "$TAG" {} + $NOTES_ARG $PRERELEASE_ARG
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish pro-plugin
        run: cargo publish -p pro-plugin
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true

      - name: Wait for crates.io to index pro-plugin
        run: sleep 60

      - name: Publish pro-core
        run: cargo publish -p pro-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true

      - name: Wait for crates.io to index pro-core
        run: sleep 60

      - name: Publish pro-cli
        run: cargo publish -p pro-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  build-pypi:
    name: Build Python wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
        with:
          args: --release --out dist --manifest-path pro-python/Cargo.toml
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist

  publish-pypi:
    name: Publish to PyPI
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/rx-pro
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
