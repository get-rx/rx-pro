[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "rx-pro"
version = "0.1.23"
description = "A blazing-fast Python package manager written in Rust"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Shawn Therrien" }]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
keywords = ["package-manager", "pip", "poetry", "rust", "fast"]

[project.urls]
Homepage = "https://github.com/get-rx/rx-pro"
Documentation = "https://rxpro.net/"
Repository = "https://github.com/get-rx/rx-pro"
Changelog = "https://github.com/get-rx/rx-pro/blob/main/CHANGELOG.md"

[project.scripts]
rx = "pro:_cli_main"

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py38"]
python-source = "python"
module-name = "pro._pro"
exclude = ["target/**", "**/__pycache__/**", "*.pyc"]
